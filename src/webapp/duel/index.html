<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مبارزه</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/shared/battleScene.css" />
<script src="/shared/characterAssets.js"></script>
<script src="/shared/battleScene.js"></script>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; padding: 12px; margin: 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  button { flex: 1; min-width: 70px; padding: 10px; border-radius: 8px; border: none; background: #2a6; color: #fff; font-size: 14px; }
  button:disabled { background: #444; color: #888; }
  .sub-actions { display: flex; gap: 8px; margin-top: 8px; }
  #log { font-size: 12px; color: #aaa; margin-top: 14px; max-height: 120px; overflow-y: auto; border-top: 1px solid #333; padding-top: 8px; }
  #status { text-align: center; margin: 8px 0; font-weight: bold; }
  .hidden { display: none; }
</style>
</head>
<body>

<div id="status">در حال بارگذاری...</div>

<div id="scene"></div>

<div class="actions" id="main-actions">
  <button id="btn-attack">حمله</button>
  <button id="btn-defense">دفاع</button>
  <button id="btn-ultimate">آلتیمیت</button>
  <button id="btn-potion">پوشن</button>
</div>

<div class="sub-actions hidden" id="target-actions">
  <button data-target="head">سر</button>
  <button data-target="body">بدن</button>
  <button data-target="leg">پا</button>
  <button id="btn-cancel-target">بازگشت</button>
</div>

<div class="sub-actions hidden" id="potion-actions">
  <button data-potion="healer">Healer</button>
  <button data-potion="healer2x">Healer 2x</button>
  <button data-potion="health">Health</button>
  <button data-potion="wizz">Wizz</button>
  <button data-potion="bodyguard">Bodyguard</button>
  <button id="btn-cancel-potion">بازگشت</button>
</div>

<div class="sub-actions hidden" id="death-duel-actions">
  <button data-choice="punch">مشت</button>
  <button data-choice="defense">دفاع</button>
  <button data-choice="magic">جادو</button>
</div>

<div id="log"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const params = new URLSearchParams(window.location.search);
const matchId = Number(params.get("matchId"));
const API_BASE = "/api/duel"; // مسیر روی همون Worker/دامنه

let currentState = null;
let pendingMainAction = null; // "attack" | "defense" در انتظار انتخاب ناحیه
let lastLogLength = 0;
let youId = null;
let enemyId = null;

const scene = new BattleScene(document.getElementById("scene"));
scene.setBackground("duel");

function el(id) { return document.getElementById(id); }

async function callApi(path, extra) {
  const res = await fetch(`${API_BASE}/${path}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ initData: tg.initData, matchId, ...extra }),
  });
  const data = await res.json();
  if (data.error) {
    el("status").textContent = "خطا: " + data.error;
    return null;
  }
  return data;
}

function sideForId(id) {
  if (String(id) === String(youId)) return "left";
  if (String(id) === String(enemyId)) return "right";
  return null;
}

// از روی متن فارسیِ راندهای تازه (که از قبل توی combat engine تولید میشن)، حدس میزنیم
// کدوم طرف چه اکشنی زد تا انیمیشن مناسب پخش بشه - نیازی به تغییر بک‌اند نیست
function playAnimationsForNewLog(log) {
  if (!Array.isArray(log)) return;
  const newLines = log.slice(lastLogLength);
  lastLogLength = log.length;

  for (const line of newLines) {
    const ids = [...line.matchAll(/مبارز (\d+)/g)].map((m) => m[1]);
    if (ids.length === 0) continue;
    const firstSide = sideForId(ids[0]);
    const secondSide = ids[1] ? sideForId(ids[1]) : (firstSide === "left" ? "right" : "left");

    if (line.includes("ضربه زد") && !line.includes("دفاع")) {
      if (firstSide) scene.slot(firstSide).playAction("attack");
      if (secondSide) { scene.slot(secondSide).playAction("hit"); scene.slot(secondSide).flashHit(); }
      scene.playSound("attack_hit");
    } else if (line.includes("را دفاع کرد")) {
      if (firstSide) scene.slot(firstSide).playAction("defend");
      if (secondSide) { scene.slot(secondSide).playAction("hit"); scene.slot(secondSide).flashHit(); }
      scene.playSound("defend_block");
    } else if (line.includes("آلتیمیت خود را زد")) {
      if (firstSide) scene.slot(firstSide).playAction("ultimate");
      if (secondSide) { scene.slot(secondSide).playAction("hit"); scene.slot(secondSide).flashHit(); }
      scene.playSound("ultimate");
    } else if (line.includes("را خنثی کرد")) {
      if (firstSide) scene.slot(firstSide).playAction("defend");
      scene.playSound("defend_block");
    } else if (line.includes("پوشن") && line.includes("استفاده کرد")) {
      if (firstSide) scene.slot(firstSide).playAction("defend"); // یه جلوه‌ی ساده برای مصرف پوشن
      scene.playSound("potion_use");
    } else if (line.includes("دمیج تاخیری گرفت")) {
      if (firstSide) { scene.slot(firstSide).flashHit(); }
    } else if (line.includes("دوئل مرگ را برد")) {
      const loserSide = firstSide === "left" ? "right" : "left";
      if (firstSide) scene.slot(firstSide).playAction("attack");
      scene.slot(loserSide).flashHit();
    }
  }
}

function renderFighterVisual(side, fighter) {
  scene.slot(side).setCharacter("race", fighter.race);
  scene.slot(side).setGear(fighter.armorKey, fighter.weaponKey);
  scene.updateHud(side, {
    level: fighter.level,
    hp: fighter.hp,
    hpMax: fighter.hpMax,
    mana: fighter.mana,
    manaMax: 8,
    label: `${fighter.name ?? "?"}${fighter.house ? " · " + fighter.house : ""}`,
  });
}

function renderLog(log) {
  el("log").innerHTML = (log ?? []).slice(-15).map((l) => `<div>${l}</div>`).join("");
}

function renderState(state) {
  currentState = state;
  const you = state.fighters[state.yourIndex];
  const enemy = state.fighters[state.yourIndex === 0 ? 1 : 0];
  youId = you.id;
  enemyId = enemy.id;

  renderFighterVisual("left", you);
  renderFighterVisual("right", enemy);
  playAnimationsForNewLog(state.log ?? []);
  renderLog(state.log ?? []);

  el("death-duel-actions").classList.toggle("hidden", !state.isDeathDuel);
  el("main-actions").classList.toggle("hidden", state.isDeathDuel);

  if (!state.isDeathDuel) {
    if (you.hasSubmittedAction) {
      el("status").textContent = "منتظر حریف...";
      setActionButtonsDisabled(true);
    } else {
      el("status").textContent = "نوبت شماست";
      setActionButtonsDisabled(false);
    }
  } else {
    el("status").textContent = "دوئل مرگ! یکی را انتخاب کنید:";
  }
}

function setActionButtonsDisabled(disabled) {
  for (const b of document.querySelectorAll("#main-actions button")) b.disabled = disabled;
}

async function refreshState() {
  const data = await callApi("state", {});
  if (data) renderState(data);
}

async function handleOutcome(data) {
  if (!data) return;
  renderState(data.state);

  if (data.outcome.status === "winner") {
    const youWon = data.state.fighters[data.outcome.winnerIndex].id === data.state.fighters[data.state.yourIndex].id;
    el("status").textContent = youWon ? "🏆 شما بردید!" : "💀 شما باختید.";
    scene.playSound(youWon ? "win" : "lose");
    setActionButtonsDisabled(true);
    el("death-duel-actions").classList.add("hidden");
  } else if (data.outcome.status === "death_duel_tie") {
    el("status").textContent = "دوئل مرگ مساوی شد، دوباره انتخاب کنید.";
  }
}

// ---------- دکمه‌های اصلی ----------
el("btn-attack").onclick = () => { pendingMainAction = "attack"; showTargetMenu(); };
el("btn-defense").onclick = () => { pendingMainAction = "defense"; showTargetMenu(); };
el("btn-ultimate").onclick = async () => {
  const data = await callApi("action", { action: "ultimate" });
  await handleOutcome(data);
};
el("btn-potion").onclick = () => {
  el("main-actions").classList.add("hidden");
  el("potion-actions").classList.remove("hidden");
};

function showTargetMenu() {
  el("main-actions").classList.add("hidden");
  el("target-actions").classList.remove("hidden");
}
el("btn-cancel-target").onclick = () => {
  el("target-actions").classList.add("hidden");
  el("main-actions").classList.remove("hidden");
};
el("btn-cancel-potion").onclick = () => {
  el("potion-actions").classList.add("hidden");
  el("main-actions").classList.remove("hidden");
};

for (const btn of document.querySelectorAll("#target-actions button[data-target]")) {
  btn.onclick = async () => {
    const target = btn.getAttribute("data-target");
    el("target-actions").classList.add("hidden");
    el("main-actions").classList.remove("hidden");
    const data = await callApi("action", { action: pendingMainAction, target });
    await handleOutcome(data);
  };
}

for (const btn of document.querySelectorAll("#potion-actions button[data-potion]")) {
  btn.onclick = async () => {
    const potionKey = btn.getAttribute("data-potion");
    el("potion-actions").classList.add("hidden");
    el("main-actions").classList.remove("hidden");
    const data = await callApi("potion", { potionKey });
    if (data) renderState(data.state);
  };
}

for (const btn of document.querySelectorAll("#death-duel-actions button[data-choice]")) {
  btn.onclick = async () => {
    const choice = btn.getAttribute("data-choice");
    const data = await callApi("death-duel-choice", { choice });
    await handleOutcome(data);
  };
}

// ---------- شروع ----------
refreshState();
setInterval(refreshState, 2500); // پولینگ ساده - چون Workers رایگان وب‌سوکت نداره
</script>
</body>
</html>
