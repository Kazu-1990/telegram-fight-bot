name = "telegram-fight-bot"
main = "src/bot/index.ts"
compatibility_date = "2025-01-01"

# پلن رایگان Workers کافیه - D1 هم توی پلن رایگان جا میشه (محدودیت‌های رایگانش رو مستندات Cloudflare ببین)

[[d1_databases]]
binding = "DB"                     # همون env.DB که توی کد استفاده شده
database_name = "fight-bot-db"      # با: wrangler d1 create fight-bot-db
database_id = "7d9fef2f-fa64-4a47-871d-fbe3167ad554"           # خروجی دستور بالا رو اینجا بذار (دوباره پرش کن، چون این فایل جایگزین قبلی میشه)

# ایمپورت کردن فایل‌های html/js/css به‌صورت رشته‌ی متنی
# (html: صفحات مینی‌اپ - js/css: موتور گرافیک مشترک صحنه‌ی مبارزه)
# نکته مهم: glob های js/css عمداً محدود به پوشه‌ی خودمون شدن، وگرنه با فایل‌های
# داخلی پکیج grammy (که خودشون .js هستن) تداخل میکنه و کل بیلد خراب میشه
[[rules]]
type = "Text"
globs = ["**/*.html", "src/webapp/shared/*.js", "src/webapp/shared/*.css"]
fallthrough = true

# متغیرهای محرمانه (BOT_TOKEN و BOT_WEBHOOK_SECRET) اینجا نیستن چون توی گیت نباید کامیت بشن.
# بعد از دیپلوی اول، این دو دستور رو بزن:
#   wrangler secret put BOT_TOKEN
#   wrangler secret put BOT_WEBHOOK_SECRET
# BOT_WEBHOOK_SECRET رو خودت یه رشته‌ی تصادفی و بلند انتخاب کن (فقط برای امنیت مسیر وبهوک).
